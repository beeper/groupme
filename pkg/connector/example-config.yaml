# Settings related to how the bridge connects to GroupMe's real-time push service.
push:
    # How long to wait (in seconds) for the initial GroupMe push connection before giving up.
    connection_timeout: 20
# Settings related to polling GroupMe's REST API for new messages, as a
# resilient fallback/replacement for the real-time push connection above
# (which has been observed to fail for extended periods in production).
poll:
    # Whether to poll for new messages via REST in addition to the push
    # connection. Safe to leave enabled even when push is working: messages
    # delivered by both are only bridged once (deduplicated by message ID).
    enabled: true
    # How often, in seconds, to poll each known chat for new messages.
    # Values below 30 are clamped up to 30.
    interval_seconds: 60
